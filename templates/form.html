<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>
<body>

    <h1>User Form</h1>

    <form action="/submit-form" method="POST">

        <p>
            <label>Full Name:</label><br>
            <input type="text" name="full_name" required>
        </p>

        <p>
            <label>Email:</label><br>
            <input type="email" name="email" required>
        </p>

        <p>
            <label>Age:</label><br>
            <input type="number" name="age" required>
        </p>

        <p>
            <label>City:</label><br>
            <input type="text" name="city" required>
        </p>

        <p>
            <label>Country:</label><br>
            <input type="text" name="country" required>
        </p>

        <p>
            <label>Occupation:</label><br>
            <input type="text" name="occupation" required>
        </p>

        <p>
            <label>Hobby:</label><br>
            <input type="text" name="hobby" required>
        </p>

        <p>
            <label>Favourite Programming Language:</label><br>
            <input type="text" name="programming_language" required>
        </p>

        <p>
            <label>Hours spent online per week:</label><br>
            <input type="number" name="online_hours" required>
        </p>

        <p>
            <label>Favourite Entertainment:</label><br>
            <input type="text" name="entertainment" required>
        </p>

        <button type="submit">Submit Form</button>

    </form>

    <p><a href="/">Home</a> | <a href="/users">View Users</a></p>

</body>
</html>
